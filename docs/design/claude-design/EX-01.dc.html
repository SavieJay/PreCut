<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EX-01 Export settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <div class="ttl">Lagos weekend</div>
    <button class="pill pr">Export</button>
  </div>
  <div class="pv" style="flex:none;height:200px"><div class="vid s-city"></div></div>
  <div class="scrim"></div>
  <div class="sheet" style="padding:0 16px 40px;gap:14px">
    <div class="grab"></div>
    <div class="row"><div class="f1" style="font-size:20px;line-height:28px;font-weight:600">Export</div><button class="ib" aria-label="Close"><span class="ms">close</span></button></div>
    <div class="col" style="gap:8px">
      <div class="sect">Resolution</div>
      <div class="seg"><button>480p</button><button>720p</button><button class="on">1080p</button><button>2K</button><button class="dis" aria-disabled="true">4K</button></div>
      <div class="row" style="gap:6px;justify-content:flex-end"><span class="ms s16 sec">info</span><span class="sub">4K: Not supported on this device</span></div>
    </div>
    <div class="col" style="gap:8px">
      <div class="sect">Frame rate</div>
      <div class="seg"><button>24</button><button>25</button><button class="on">30</button><button>50</button><button>60</button></div>
    </div>
    <div class="row" style="gap:12px;align-items:flex-start">
      <div class="col f1" style="gap:8px"><div class="sect">Bitrate</div><div class="seg"><button>Lower</button><button class="on">Recommended</button><button>Higher</button></div></div>
    </div>
    <div class="row" style="gap:16px;align-items:flex-end">
      <div class="col" style="gap:8px;width:180px"><div class="sect">Codec</div><div class="seg"><button class="on">H.264</button><button>HEVC</button></div></div>
      <div class="swr f1" style="min-height:40px"><div class="col"><span>HDR</span><span class="d">HDR10</span></div><button class="sw" role="switch" aria-checked="false" aria-label="HDR"></button></div>
    </div>
    <div class="row" style="justify-content:space-between;padding:4px 0;border-top:1px solid #2E2E33;padding-top:12px">
      <span class="sec" style="font-size:14px">Estimated size</span><span class="tnum" style="font-size:16px;font-weight:600">86 MB <span class="sec" style="font-weight:400">· 0:18</span></span>
    </div>
    <button class="btn f lg w"><span class="ms">movie</span>Export video</button>
    <div class="row" style="gap:8px">
      <button class="btn o f1"><span class="ms">music_note</span>Audio only</button>
      <button class="btn o f1"><span class="ms">image</span>Save frame</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
