<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-06b Filters – My LUTs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-beach" style="filter:contrast(1.15) saturate(.9) sepia(.15)"></div></div>
  <div class="pb">
    <div class="tc">0:02 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:142px">0:00</span><span class="rl" style="left:206px">0:02</span><span class="rl" style="left:270px">0:04</span><span class="rl" style="left:334px">0:06</span><span class="rl" style="left:398px">0:08</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:142px;width:133px"><div class="bdgs"><span class="bdg">4.2s</span></div></div>
      <div class="clip s-city" style="left:277px;width:177px"></div>
      <div class="sel" style="left:142px;width:133px"></div>
      <div class="hl" style="left:128px"></div>
      <div class="hr" style="left:275px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
      <div class="pinr"><button class="addbtn" aria-label="Add media"><span class="ms">add</span></button></div>
    </div>
    <div class="lane"></div>
    <div class="lane au"><div class="bar b-mus" style="left:142px;width:384px"><div class="wave"></div><div class="beats" style="background-position:8px 0"></div><span class="ms">music_note</span><span>Afrobeat Sunrise</span></div></div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Filters</div><button class="tbtn acc"><span class="ms s18">done_all</span>Apply to all</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="hs" style="margin-left:-112px">
        <button class="chip">Retro</button><button class="chip">Mono</button><button class="chip">Food</button><button class="chip">Nature</button><button class="chip on">My LUTs</button>
      </div>
      <div class="hs" style="gap:10px;padding-top:4px;padding-bottom:4px">
        <button class="ft"><span class="im"><span class="ms">block</span></span>None</button>
        <button class="ft"><span class="im" style="background:#17171A;box-shadow:inset 0 0 0 1.5px #5A5A62;border-radius:8px"><span class="ms">add</span></span>Import .cube</button>
        <button class="ft on"><span class="im"><span class="g s-beach" style="filter:contrast(1.15) saturate(.9) sepia(.15)"></span></span>Harbour 709</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:saturate(.6) contrast(1.2)"></span></span>Bleach v2</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:hue-rotate(-25deg) saturate(1.3)"></span></span>Dusk grade</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:grayscale(1) contrast(1.1)"></span></span>Silver</button>
      </div>
      <div class="sl"><span class="lb" style="width:64px">Intensity</span><div class="trk"><div class="fill" style="width:100%"></div><div class="knob" style="left:100%"></div></div><span class="vl">100</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
