<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P-04 Chroma key</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city">
    <div class="s-green" style="position:absolute;inset:10% 0 0 0;background-size:100% 100%"></div>
    <div style="position:absolute;left:24%;top:30%;width:16px;height:16px;margin:-8px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px #000"></div>
    <div style="position:absolute;left:24%;top:30%;width:72px;height:72px;margin:-104px 0 0 -36px;border-radius:36px;border:3px solid #fff;background:#19C24A;box-shadow:0 4px 12px rgba(0,0,0,.5);display:grid;place-items:center">
      <div style="width:10px;height:10px;border:1.5px solid #fff"></div>
    </div>
  </div></div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane ov">
      <div class="clip sm s-green" style="left:110px;width:200px"></div>
      <div class="sel" style="left:110px;width:200px;height:44px"></div>
      <div class="hl" style="left:96px;height:44px"></div>
      <div class="hr" style="left:310px;height:44px"></div>
    </div>
    <div class="lane main" style="height:40px">
      <div class="clip sm s-beach" style="left:-18px;width:133px"></div>
      <div class="clip sm s-city" style="left:117px;width:177px"></div>
      <div class="clip sm s-dog" style="left:296px;width:262px"></div>
    </div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Chroma key</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="row" style="gap:12px;height:48px">
        <button class="ib" style="background:#5C1426;color:#FF4D6D" aria-label="Pick colour from preview, active"><span class="ms">colorize</span></button>
        <div style="width:32px;height:32px;border-radius:16px;background:#19C24A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)"></div>
        <div class="col"><span style="font-size:14px;font-weight:500">Picked colour</span><span class="sub tnum">#19C24A · drag on the preview</span></div>
      </div>
      <div class="sl"><span class="lb">Intensity</span><div class="trk"><div class="fill" style="width:62%"></div><div class="knob" style="left:62%"></div></div><span class="vl">62</span></div>
      <div class="sl"><span class="lb">Shadow</span><div class="trk"><div class="fill" style="width:20%"></div><div class="knob" style="left:20%"></div></div><span class="vl">20</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>

</html>
