<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X-04c Text styles – Effects</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"><div class="tbox" style="left:50%;top:54%;transform:translateX(-50%);padding:2px 10px;white-space:nowrap"><span style="font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:40px;color:#FFD43B;letter-spacing:1px;-webkit-text-stroke:1.5px #0E0E10;text-shadow:4px 5px 6px rgba(0,0,0,.75)">LAGOS NIGHTS</span></div></div></div>
  <div class="pnl">
    <div class="pnl-h" style="padding-left:4px"><button class="ib" aria-label="Back to Text"><span class="ms">arrow_back</span></button><div class="t">Text style</div><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="utabs"><button class="utab">Font</button><button class="utab">Style</button><button class="utab on">Effects</button><button class="utab">Animation</button><button class="utab">Templates</button></div>
    <div class="pnl-b" style="padding-top:12px;gap:4px">
      <div class="hs" style="padding-bottom:8px">
        <button class="chip">Stroke <span class="dot"></span></button>
        <button class="chip on">Shadow</button>
        <button class="chip">Glow</button>
        <button class="chip">Background</button>
        <button class="chip">Curve</button>
      </div>
      <div class="row" style="gap:12px;height:40px"><span class="lb sub" style="width:72px;font-size:13px">Colour</span>
        <div class="sws"><button class="swt rb" style="width:28px;height:28px" aria-label="Custom colour"></button><button class="swt on" style="width:28px;height:28px;background:#000" aria-label="Black, selected"></button><button class="swt" style="width:28px;height:28px;background:#fff" aria-label="White"></button><button class="swt" style="width:28px;height:28px;background:#FF4D6D" aria-label="Pink"></button><button class="swt" style="width:28px;height:28px;background:#4DA3FF" aria-label="Blue"></button></div>
      </div>
      <div class="sl"><span class="lb">Blur</span><div class="trk"><div class="fill" style="width:30%"></div><div class="knob" style="left:30%"></div></div><span class="vl">6</span></div>
      <div class="sl"><span class="lb">Distance</span><div class="trk"><div class="fill" style="width:25%"></div><div class="knob" style="left:25%"></div></div><span class="vl">5</span></div>
      <div class="sl"><span class="lb">Angle</span><div class="trk"><div class="fill" style="width:37.5%"></div><div class="knob" style="left:37.5%"></div></div><span class="vl">135°</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
