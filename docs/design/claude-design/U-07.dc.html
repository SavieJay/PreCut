<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U-07 Audio speed</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"><div class="cap" style="top:64%">Lagos nights</div></div></div>
  <div class="pb">
    <div class="tc">0:07 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:-18px;width:133px"></div>
      <div class="clip s-city" style="left:117px;width:177px"></div>
      <div class="clip s-dog" style="left:296px;width:262px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="lane au"><div class="bar b-mus on" style="left:-18px;width:256px;padding-left:24px"><div class="wave" style="background-size:66% 30%,66% 60%,66% 85%,66% 100%;background-repeat:repeat-x"></div><span class="ms">music_note</span><span>Afrobeat Sunrise · 1.5x</span></div><div class="bh r" style="left:238px"></div></div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Speed</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="hs">
        <button class="chip">0.25x</button><button class="chip">0.5x</button><button class="chip">1x</button><button class="chip on">1.5x</button><button class="chip">2x</button><button class="chip">4x</button>
      </div>
      <div style="position:relative;height:52px;padding:0 10px;display:flex;align-items:center">
        <div class="trk">
          <div class="tk" style="left:0"></div><div class="tk" style="left:25%"></div><div class="tk" style="left:50%;height:14px;top:-5px;background:#9A9AA3"></div><div class="tk" style="left:75%"></div><div class="tk" style="left:100%"></div>
          <span class="tkl" style="left:0">0.25x</span><span class="tkl" style="left:25%">0.5x</span><span class="tkl" style="left:50%">1x</span><span class="tkl" style="left:75%">2x</span><span class="tkl" style="left:100%">4x</span>
          <div class="fill" style="left:50%;width:14.6%"></div>
          <div class="knob" style="left:64.6%"></div>
          <span class="bub" style="left:64.6%">1.5x</span>
        </div>
      </div>
      <div class="swr"><div class="tnum" style="font-size:15px;font-weight:600">12.0s <span class="sec" style="font-weight:400">→</span> 8.0s</div></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
