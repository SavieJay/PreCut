<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-20 Rotate</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv">
    <div class="vid" style="background:#000;display:grid;place-items:center">
      <div class="s-dog" style="width:100%;aspect-ratio:16/9;background-size:100% 100%;transform:rotate(90deg) scale(.56)"></div>
      <div class="toast" style="top:50%;transform:translate(-50%,-50%)"><span class="ms s18">rotate_90_degrees_cw</span>Rotated 90°</div>
    </div>
  </div>
  <div class="pb">
    <div class="tc">0:12 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:14px">0:06</span><span class="rl" style="left:78px">0:08</span><span class="rl" style="left:142px">0:10</span><span class="rl" style="left:206px">0:12</span><span class="rl" style="left:270px">0:14</span><span class="rl" style="left:334px">0:16</span><span class="rl" style="left:398px">0:18</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-city" style="left:-64px;width:177px"></div>
      <div class="clip s-dog" style="left:115px;width:262px"><div class="bdgs"><span class="bdg">8.2s</span><span class="bdg"><span class="ms">rotate_90_degrees_cw</span>90°</span></div></div>
      <div class="sel" style="left:115px;width:262px"></div>
      <div class="hl" style="left:101px"></div>
      <div class="hr" style="left:377px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="lane"></div>
    <div class="lane au"><div class="bar b-mus" style="left:-18px;width:384px"><div class="wave"></div><div class="beats" style="background-position:8px 0"></div><span>Ocean waves</span></div></div>
    <div class="lane au"></div>
    <div class="phd"></div>
  </div>
  <div class="bot">
    <div class="tbar" style="margin-left:-512px">
      <button class="tool"><span class="ms">content_cut</span>Split</button>
      <button class="tool"><span class="ms">width</span>Trim</button>
      <button class="tool"><span class="ms">music_note</span>Audio</button>
      <button class="tool"><span class="ms">speed</span>Speed</button>
      <button class="tool"><span class="ms">volume_up</span>Volume</button>
      <button class="tool"><span class="ms">gradient</span>Fade</button>
      <button class="tool"><span class="ms">audio_file</span>Extract</button>
      <button class="tool"><span class="ms">filter</span>Filters</button>
      <button class="tool"><span class="ms">tune</span>Adjust</button>
      <button class="tool pr"><span class="ms">rotate_90_degrees_cw</span>Rotate</button>
      <button class="tool"><span class="ms">swap_horiz</span>Replace</button>
      <button class="tool"><span class="ms">title</span>Text</button>
      <button class="tool"><span class="ms">aspect_ratio</span>Ratio</button>
      <button class="tool"><span class="ms">image</span>Cover</button>
      <button class="tool"><span class="ms">library_add_check</span>Select</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
