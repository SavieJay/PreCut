<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-19 Reverse – progress</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"></div></div>
  <div class="pb">
    <div class="tc">0:07 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:-18px;width:133px"></div>
      <div class="clip s-city" style="left:117px;width:177px"></div>
      <div class="clip s-dog" style="left:296px;width:262px"></div>
      <div class="sel" style="left:117px;width:177px"></div>
      <div class="hl" style="left:103px"></div>
      <div class="hr" style="left:294px"></div>
    </div>
    <div class="lane"><div class="bar b-txt" style="left:142px;width:128px"><span>Lagos nights</span></div></div>
    <div class="lane au"><div class="bar b-mus" style="left:-18px;width:384px;padding-left:24px"><span>Afrobeat Sunrise</span></div></div>
    <div class="lane au"><div class="bar b-mus" style="left:238px;width:256px"><span>Ocean waves</span></div></div>
    <div class="phd"></div>
  </div>
  <div class="bot"><div class="tbar"></div><div class="inset-b"></div></div>
  <div class="scrim"></div>
  <div class="dlg" style="gap:20px">
    <div class="row" style="gap:12px"><span class="ms" style="color:#FF4D6D">fast_rewind</span><h2 style="font-size:20px">Reversing clip… <span class="tnum">45%</span></h2></div>
    <div style="height:6px;border-radius:3px;background:#3A3A40;position:relative" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Reverse progress"><div style="position:absolute;left:0;top:0;bottom:0;width:45%;border-radius:3px;background:#FF4D6D"></div></div>
    <p>A reversed copy of this 5.6s clip is being made on your phone. About 10 seconds left.</p>
    <div class="acts"><button class="btn t">Cancel</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
