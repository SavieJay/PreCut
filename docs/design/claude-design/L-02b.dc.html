<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>L-02b Adjust from a layer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city" style="filter:saturate(1.3) brightness(1.08)"></div></div>
  <div class="pb">
    <div class="tc">0:10 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:14px">0:04</span><span class="rl" style="left:78px">0:06</span><span class="rl" style="left:142px">0:08</span><span class="rl" style="left:206px">0:10</span><span class="rl" style="left:270px">0:12</span><span class="rl" style="left:334px">0:14</span><span class="rl" style="left:398px">0:16</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-city" style="left:21px;width:177px"></div>
      <div class="clip s-dog" style="left:200px;width:262px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="lane"><div class="bar b-look" style="left:62px;width:96px"><span class="ms">filter</span><span>Teal &amp; Orange</span></div></div>
    <div class="lane"><div class="bar b-look on" style="left:160px;width:96px"><span class="ms">tune</span><span>Adjust</span></div><div class="bh l" style="left:150px"></div><div class="bh r" style="left:256px"></div></div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Adjust · layer</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="hs">
        <button class="chip"><span class="ms">light_mode</span>Brightness <span class="v">8</span></button>
        <button class="chip"><span class="ms">contrast</span>Contrast</button>
        <button class="chip on"><span class="ms">palette</span>Saturation <span class="v">30</span></button>
        <button class="chip"><span class="ms">exposure</span>Exposure</button>
        <button class="chip">Temperature</button>
      </div>
      <div style="position:relative;height:56px;display:flex;align-items:center;gap:12px">
        <span class="vl" style="text-align:left;width:36px;color:#9A9AA3">−100</span>
        <div class="trk"><div class="zm" style="left:50%"></div><div class="fill" style="left:50%;width:15%"></div><div class="knob" style="left:65%"></div><span class="bub" style="left:65%">30</span></div>
        <span class="vl" style="width:36px;color:#9A9AA3">100</span>
      </div>
      <div class="sub">Applies to everything under this layer from 0:09.0 to 0:12.0</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
