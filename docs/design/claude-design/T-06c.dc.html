<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-06c Filters – 360 × 800 check</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph c">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend</button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill" style="padding:0 14px">Export</button>
  </div>
  <div class="pv"><div class="vid s-beach" style="filter:saturate(1.35) hue-rotate(-12deg) contrast(1.12)"></div></div>
  <div class="pb">
    <div class="tc">0:02 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru"><span class="rl" style="left:116px">0:00</span><span class="rl" style="left:180px">0:02</span><span class="rl" style="left:244px">0:04</span><span class="rl" style="left:308px">0:06</span><div class="ticks" style="background-position:4px 0"></div></div>
    <div class="lane main">
      <div class="clip s-beach" style="left:116px;width:133px"><div class="bdgs"><span class="bdg">4.2s</span></div></div>
      <div class="clip s-city" style="left:251px;width:177px"></div>
      <div class="sel" style="left:116px;width:133px"></div><div class="hl" style="left:102px"></div><div class="hr" style="left:249px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="lane au"><div class="bar b-mus" style="left:116px;width:384px"><div class="wave"></div><span class="ms">music_note</span><span>Afrobeat Sunrise</span></div></div>
    <div class="phd" style="left:179px"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Filters</div><button class="tbtn acc" aria-label="Apply to all"><span class="ms s18">done_all</span>All</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="hs"><button class="chip">Basic</button><button class="chip">Life</button><button class="chip on">Film</button><button class="chip">Retro</button><button class="chip">Mono</button><button class="chip">Food</button></div>
      <div class="hs" style="gap:10px;padding-top:4px;padding-bottom:4px">
        <button class="ft"><span class="im"><span class="ms">block</span></span>None</button>
        <button class="ft on"><span class="im"><span class="g s-beach" style="filter:saturate(1.35) hue-rotate(-12deg) contrast(1.12)"></span></span>Teal &amp; Orange</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:sepia(.45) saturate(1.2)"></span></span>Lagos Gold</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:contrast(.8) brightness(1.1) saturate(.7)"></span></span>Faded</button>
        <button class="ft"><span class="im"><span class="g s-beach" style="filter:contrast(1.3) saturate(.85) brightness(.9)"></span></span>Cinema</button>
      </div>
      <div class="sl"><span class="lb" style="width:60px">Intensity</span><div class="trk"><div class="fill" style="width:80%"></div><div class="knob" style="left:80%"></div></div><span class="vl" style="width:32px">80</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
