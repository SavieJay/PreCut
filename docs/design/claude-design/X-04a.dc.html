<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X-04a Text styles – Font</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=Pacifico&family=Playfair+Display:wght@700&family=Space+Mono:wght@700&display=swap">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"><div class="tbox" style="left:50%;top:56%;transform:translateX(-50%);padding:2px 10px;white-space:nowrap"><span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:38px;color:#FFD43B;letter-spacing:1px">LAGOS NIGHTS</span></div></div></div>
  <div class="pnl">
    <div class="pnl-h" style="padding-left:4px"><button class="ib" aria-label="Back to Text"><span class="ms">arrow_back</span></button><div class="t">Text style</div><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="utabs"><button class="utab on">Font</button><button class="utab">Style</button><button class="utab">Effects</button><button class="utab">Animation</button><button class="utab">Templates</button></div>
    <div class="lst" style="padding:4px 0">
      <button class="li" style="color:#FF4D6D;min-height:48px"><span class="ms" style="color:#FF4D6D">upload_file</span>Import font (.ttf, .otf)</button>
      <button class="li" style="min-height:48px"><span class="f1">Roboto Flex</span><span class="sub">Default</span></button>
      <button class="li" style="min-height:48px;background:#222226"><span class="f1" style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px">Bebas Neue</span><span class="ms" style="color:#FF4D6D">check</span></button>
      <button class="li" style="min-height:48px"><span class="f1" style="font-family:'Playfair Display',serif;font-weight:700">Playfair Display</span></button>
      <button class="li" style="min-height:48px"><span class="f1" style="font-family:'Pacifico',cursive">Pacifico</span></button>
      <button class="li" style="min-height:48px"><span class="f1" style="font-family:'Space Mono',monospace;font-weight:700">Space Mono</span></button>
      <button class="li" style="min-height:48px"><span class="f1" style="font-family:'Caveat',cursive;font-weight:600;font-size:20px">Caveat</span><span class="sub">Imported</span></button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>

  renderVals() { return {}; }

</html>
