<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U-05 Voiceover recording</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib dim" aria-label="Back, unavailable while recording"><span class="ms">arrow_back</span></button>
    <div class="ttl">Lagos weekend</div>
    <button class="pill dis" aria-disabled="true">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"><div class="cap" style="top:64%">Lagos nights</div></div>
    <div class="chipov"><span class="ms s16">volume_off</span>Preview muted</div>
  </div>
  <div class="pb">
    <div class="tc">0:07.2 <span class="sec">/ 0:18</span></div>
    <span></span><span></span>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:-18px;width:133px"></div>
      <div class="clip s-city" style="left:117px;width:177px"></div>
      <div class="clip s-dog" style="left:296px;width:262px"></div>
    </div>
    <div class="lane au"><div class="bar b-mus" style="left:-18px;width:384px;padding-left:24px;opacity:.5"><span class="ms">music_note</span><span>Afrobeat Sunrise</span></div></div>
    <div class="lane au"><div class="bar b-voi" style="left:78px;width:129px;border-radius:4px 0 0 4px"><div class="wave"></div><span class="ms">mic</span><span>Recording</span></div></div>
    <div class="phd" style="background:#FF6B5E"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Voiceover</div></div>
    <div class="pnl-b" style="align-items:center;gap:10px;padding-bottom:20px">
      <div class="row" style="gap:8px"><span style="width:8px;height:8px;border-radius:4px;background:#FF6B5E"></span><span class="tnum" style="font-size:28px;line-height:34px;font-weight:600">0:04.2</span></div>
      <button style="width:80px;height:80px;border-radius:40px;box-shadow:inset 0 0 0 4px #F2F2F5;display:grid;place-items:center" aria-label="Stop recording"><span style="width:30px;height:30px;border-radius:6px;background:#FF4D6D"></span></button>
      <div class="sub tnum">Recording starts at 0:03 · tap to stop</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
