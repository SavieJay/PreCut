<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E-05 Reordering</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv">
    <div class="vid s-dog"></div>
    <div class="ovhint" style="top:16px"><span class="ms s16">swap_horiz</span>Drag to reorder</div>
  </div>
  <div class="pb">
    <div class="tc">0:07 <span class="sec">/ 0:18</span></div>
    <button class="ib dim" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r dim" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru" style="opacity:.3">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:124px;top:4px;width:48px;height:48px;background-size:48px 48px"></div>
      <div style="position:absolute;left:181px;top:0;width:3px;height:56px;border-radius:2px;background:#fff"></div>
      <div class="clip s-city" style="left:236px;top:4px;width:48px;height:48px;background-size:48px 48px"></div>
      <div class="clip s-dog" style="left:184px;top:-10px;width:52px;height:52px;background-size:52px 52px;box-shadow:0 8px 20px rgba(0,0,0,.7),0 0 0 2px #fff;z-index:8"></div>
      <div style="position:absolute;left:198px;top:22px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(255,255,255,.5);z-index:9" aria-hidden="true"></div>
    </div>
    <div style="opacity:.3">
      <div class="lane"><div class="bar b-txt" style="left:142px;width:128px"><span>Lagos nights</span></div></div>
      <div class="lane au"><div class="bar b-mus" style="left:-18px;width:384px;padding-left:24px"><span>Afrobeat Sunrise</span></div></div>
      <div class="lane au"><div class="bar b-mus" style="left:238px;width:256px"><span>Ocean waves</span></div></div>
    </div>
  </div>
  <div class="bot">
    <div class="tbar" style="opacity:.38">
      <button class="tool dis"><span class="ms">content_cut</span>Split</button>
      <button class="tool dis"><span class="ms">width</span>Trim</button>
      <button class="tool dis"><span class="ms">music_note</span>Audio</button>
      <button class="tool dis"><span class="ms">speed</span>Speed</button>
      <button class="tool dis"><span class="ms">volume_up</span>Volume</button>
      <button class="tool dis"><span class="ms">gradient</span>Fade</button>
      <button class="tool dis"><span class="ms">audio_file</span>Extract</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
