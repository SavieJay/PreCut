<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E-08b Preview ready</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Balogun market<span class="ms s18 sec">edit</span></button>
    <button class="ib dim" aria-label="Undo, unavailable"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-market"></div></div>
  <div class="pb">
    <div class="tc">0:00 <span class="sec">/ 0:31</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:206px">0:00</span><span class="rl" style="left:270px">0:02</span><span class="rl" style="left:334px">0:04</span><span class="rl" style="left:398px">0:06</span>
      <div class="ticks" style="left:206px"></div>
    </div>
    <div class="lane main">
      <div class="clip s-market" style="left:206px;width:300px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
      <div class="pinr"><button class="addbtn" aria-label="Add media"><span class="ms">add</span></button></div>
    </div>
    <div class="lane"></div>
    <div class="lane au"><button class="addau" style="left:206px"><span class="ms">add</span>Add audio</button></div>
    <div class="lane au"></div>
    <div class="phd"></div>
  </div>
  <div class="bot">
    <div class="tbar">
      <button class="tool"><span class="ms">content_cut</span>Split</button>
      <button class="tool"><span class="ms">width</span>Trim</button>
      <button class="tool"><span class="ms">music_note</span>Audio</button>
      <button class="tool"><span class="ms">speed</span>Speed</button>
      <button class="tool"><span class="ms">volume_up</span>Volume</button>
      <button class="tool"><span class="ms">gradient</span>Fade</button>
      <button class="tool"><span class="ms">audio_file</span>Extract</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
