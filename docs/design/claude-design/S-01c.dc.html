<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S-01c Stickers – My images</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}.mi-t{aspect-ratio:1/1;border-radius:8px;background-color:#222226;background-size:100% 100%;position:relative}.chkr{background-image:linear-gradient(45deg,#2A2A2F 25%,transparent 25%,transparent 75%,#2A2A2F 75%),linear-gradient(45deg,#2A2A2F 25%,transparent 25%,transparent 75%,#2A2A2F 75%);background-size:12px 12px;background-position:0 0,6px 6px}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Jollof night</button>
    <button class="pill">Export</button>
  </div>
  <div class="pv" style="flex:none;height:300px"><div class="vid s-food"></div></div>
  <div class="sheet" style="top:330px;padding-bottom:24px">
    <div class="grab"></div>
    <div class="row" style="padding:0 8px 0 16px"><div class="f1" style="font-size:16px;font-weight:600">Stickers</div><button class="ib" aria-label="Close"><span class="ms">close</span></button></div>
    <div class="utabs"><button class="utab">Emoji</button><button class="utab on">My images</button></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:16px">
      <button class="mi-t" style="background:#17171A;box-shadow:inset 0 0 0 1.5px #5A5A62;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#F2F2F5;font-size:11px"><span class="ms">add_photo_alternate</span>Import</button>
      <button class="mi-t chkr" aria-label="Logo sticker"><svg viewBox="0 0 108 108" style="position:absolute;inset:12%" aria-hidden="true"><g transform="translate(54 54) scale(1.05) translate(-54 -54)"><path fill-rule="evenodd" fill="#E4E4E8" d="M33 22 H60 C73 22 84 32 84 45 C84 58 73 67 60 67 H54 V82 C54 85 52 87 49 87 H35 C32 87 30 85 30 82 V25 C30 23 31 22 33 22 Z M41 31 C39.5 30.5 38.6 31.6 39 33 L45 60 C45.4 61.6 46.8 62 48 61 L70 44 C71.3 43 71 41.5 69.4 41 Z"/></g></svg></button>
      <button class="mi-t chkr" aria-label="Chef hat sticker"><div class="s-portrait" style="position:absolute;inset:14%;border-radius:50%;background-size:100% 100%"></div></button>
      <button class="mi-t s-food" aria-label="Plate photo"></button>
      <button class="mi-t s-market" aria-label="Market photo"></button>
      <button class="mi-t chkr" aria-label="Dog cutout"><div class="s-dog" style="position:absolute;inset:18%;border-radius:40%;background-size:100% 100%"></div></button>
      <button class="mi-t s-cafe" aria-label="Coffee photo"></button>
      <button class="mi-t s-beach" aria-label="Beach photo"></button>
    </div>
    <div class="sub" style="padding:0 16px">PNG transparency is kept · long-press to remove from this list</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
