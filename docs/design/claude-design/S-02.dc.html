<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S-02 Draw</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Discard drawing"><span class="ms">close</span></button>
    <div class="ttl" style="justify-content:center">Draw</div>
    <button class="ib" aria-label="Undo stroke"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo stroke, unavailable"><span class="ms">redo</span></button>
    <button class="done" style="background:#D92B50"><span class="ms">check</span>Done</button>
  </div>
  <div class="pv"><div class="vid s-dog">
    <svg viewBox="0 0 100 178" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <path d="M30 40 C 32 28, 48 26, 50 36 C 52 26, 68 28, 70 40 C 72 54, 50 64, 50 70 C 50 64, 28 54, 30 40 Z" fill="none" stroke="#FF4D6D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 150 C 30 144, 38 156, 46 148 S 62 142, 70 150 S 80 156, 84 148" fill="none" stroke="#FFD43B" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;left:78%;top:80%;width:24px;height:24px;margin:-12px;border-radius:12px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)"></div>
  </div></div>
  <div class="pnl">
    <div class="pnl-b" style="padding-top:16px;gap:12px">
      <div class="row" style="gap:8px">
        <button class="chip on"><span class="ms">brush</span>Brush</button>
        <button class="chip"><span class="ms">ink_eraser</span>Eraser</button>
      </div>
      <div class="sl"><span class="lb">Size</span><div class="trk"><div class="fill" style="width:36%"></div><div class="knob" style="left:36%"></div></div><span class="vl">12</span></div>
      <div class="sws" style="justify-content:space-between;padding:4px 2px">
        <button class="swt rb" aria-label="Custom colour"></button>
        <button class="swt" style="background:#FFFFFF" aria-label="White"></button>
        <button class="swt" style="background:#000000" aria-label="Black"></button>
        <button class="swt" style="background:#FFD43B" aria-label="Yellow"></button>
        <button class="swt on" style="background:#FF4D6D" aria-label="Pink, selected"></button>
        <button class="swt" style="background:#FF8A3D" aria-label="Orange"></button>
        <button class="swt" style="background:#38D9A9" aria-label="Mint"></button>
        <button class="swt" style="background:#4DA3FF" aria-label="Blue"></button>
      </div>
      <div class="sub">Becomes a sticker that shows for 3s from 0:12</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
