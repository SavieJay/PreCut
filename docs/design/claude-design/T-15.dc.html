<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-15 Transform on preview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv">
    <div class="vid" style="background:#000">
      <div style="position:absolute;left:15%;top:15%;width:70%;height:70%;transform:rotate(15deg)">
        <div class="s-dog" style="position:absolute;inset:0;background-size:100% 100%"></div>
        <div style="position:absolute;inset:-2px;border:2px solid #fff"></div>
        <div class="hd" style="left:-12px;top:-12px;width:20px;height:20px"></div>
        <div class="hd" style="right:-12px;top:-12px;width:20px;height:20px"></div>
        <div class="hd" style="left:-12px;bottom:-12px;width:20px;height:20px"></div>
        <div class="hd" style="right:-12px;bottom:-12px;width:20px;height:20px"></div>
        <div class="hd" style="left:50%;bottom:-40px;margin-left:-12px"><span class="ms">rotate_right</span></div>
      </div>
      <div class="gv"></div>
      <div class="chipov" style="left:50%;transform:translateX(-50%);top:10px;font-size:13px;font-weight:600"><span class="ms s16">rotate_right</span><span class="tnum">15°</span></div>
    </div>
  </div>
  <div class="pb">
    <div class="tc">0:12 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:14px">0:06</span><span class="rl" style="left:78px">0:08</span><span class="rl" style="left:142px">0:10</span><span class="rl" style="left:206px">0:12</span><span class="rl" style="left:270px">0:14</span><span class="rl" style="left:334px">0:16</span><span class="rl" style="left:398px">0:18</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-city" style="left:-64px;width:177px"></div>
      <div class="clip s-dog" style="left:115px;width:262px"></div>
      <div class="sel" style="left:115px;width:262px"></div>
      <div class="hl" style="left:101px"></div>
      <div class="hr" style="left:377px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Transform</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="row" style="gap:8px">
        <button class="chip"><span class="ms">fit_screen</span>Fit</button>
        <button class="chip"><span class="ms">crop_free</span>Fill</button>
        <div class="f1"></div>
        <span class="sub tnum">Scale 70% · 15° · X 0 · Y 0</span>
      </div>
      <div class="sub">Drag to move · pinch to scale · twist to rotate</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
