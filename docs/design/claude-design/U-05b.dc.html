<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>U-05b Voiceover – ready to record</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-beach"></div></div>
  <div class="pb">
    <div class="tc">0:03.0 <span class="sec">/ 0:18</span></div>
    <span></span>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:142px">0:01</span><span class="rl" style="left:206px">0:03</span><span class="rl" style="left:270px">0:05</span><span class="rl" style="left:334px">0:07</span><span class="rl" style="left:398px">0:09</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:110px;width:133px"></div>
      <div class="clip s-city" style="left:245px;width:177px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="lane au"><div class="bar b-mus" style="left:110px;width:384px"><div class="wave"></div><span class="ms">music_note</span><span>Afrobeat Sunrise</span></div></div>
    <div class="lane au"><div style="position:absolute;left:206px;top:0;height:24px;width:120px;border-radius:4px;border:1.5px dashed #7B5BD6;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#B9A6F0;gap:4px"><span class="ms" style="font-size:14px">mic</span>Voiceover starts here</div></div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Voiceover</div><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b" style="align-items:center;gap:10px;padding-bottom:20px">
      <span class="tnum sec" style="font-size:28px;line-height:34px;font-weight:600">0:00.0</span>
      <button style="width:80px;height:80px;border-radius:40px;box-shadow:inset 0 0 0 4px #F2F2F5;display:grid;place-items:center" aria-label="Start recording"><span style="width:60px;height:60px;border-radius:30px;background:#FF4D6D"></span></button>
      <div class="sub tnum">Recording starts at 0:03 · scrub to change</div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
