<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-12b Edit – crop mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Cancel crop"><span class="ms">close</span></button>
    <div class="ttl" style="justify-content:center">Crop</div>
    <button class="ib acc" aria-label="Apply crop"><span class="ms">check</span></button>
  </div>
  <div class="pv" style="padding:16px">
    <div class="vid s-dog">
      <div style="position:absolute;left:12%;top:20%;width:76%;height:52%;box-shadow:0 0 0 999px rgba(0,0,0,.62);border:1.5px solid #fff">
        <div style="position:absolute;left:33.33%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)"></div>
        <div style="position:absolute;left:66.66%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)"></div>
        <div style="position:absolute;top:33.33%;left:0;right:0;height:1px;background:rgba(255,255,255,.55)"></div>
        <div style="position:absolute;top:66.66%;left:0;right:0;height:1px;background:rgba(255,255,255,.55)"></div>
        <div style="position:absolute;left:-4px;top:-4px;width:22px;height:22px;border-left:4px solid #fff;border-top:4px solid #fff"></div>
        <div style="position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-right:4px solid #fff;border-top:4px solid #fff"></div>
        <div style="position:absolute;left:-4px;bottom:-4px;width:22px;height:22px;border-left:4px solid #fff;border-bottom:4px solid #fff"></div>
        <div style="position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-right:4px solid #fff;border-bottom:4px solid #fff"></div>
      </div>
    </div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Ratio</div><button class="tbtn sec">Reset</button></div>
    <div class="pnl-b">
      <div class="hs">
        <button class="chip on"><span class="ms">crop_free</span>Free</button>
        <button class="chip"><span class="ms">crop_original</span>Original</button>
        <button class="chip"><span class="rg" style="width:9px;height:16px"></span>9:16</button>
        <button class="chip"><span class="rg" style="width:18px;height:10px"></span>16:9</button>
        <button class="chip"><span class="rg" style="width:14px;height:14px"></span>1:1</button>
        <button class="chip"><span class="rg" style="width:12px;height:15px"></span>4:5</button>
      </div>
      <div class="row" style="justify-content:center;gap:24px;padding-top:4px">
        <button class="ib" style="background:#222226" aria-label="Mirror"><span class="ms">flip</span></button>
        <button class="ib" style="background:#222226" aria-label="Rotate 90 degrees"><span class="ms">rotate_90_degrees_cw</span></button>
      </div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
