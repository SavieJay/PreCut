<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-16 Transitions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-beach"><div style="position:absolute;inset:0;background:#000;opacity:.55"></div></div></div>
  <div class="pb">
    <div class="tc">0:04.2 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:91px">0:00.6</span><span class="rl" style="left:142px">0:02</span><span class="rl" style="left:206px">0:04</span><span class="rl" style="left:270px">0:06</span><span class="rl" style="left:334px">0:08</span><span class="rl" style="left:398px">0:10</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:72px;width:133px"></div>
      <div class="clip s-city" style="left:207px;width:177px"></div>
      <div style="position:absolute;left:190px;width:34px;top:0;height:56px;background:rgba(255,77,109,.28);border-left:1px solid #FF4D6D;border-right:1px solid #FF4D6D;z-index:2"></div>
      <div class="trb on" style="left:206px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="phd" style="opacity:.5"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Transition</div><button class="tbtn acc"><span class="ms s18">done_all</span>Apply to all</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b" style="gap:12px">
      <div class="tg">
        <button class="pt"><span class="im"><span class="ms">block</span></span>None</button>
        <button class="pt on"><span class="im"><span class="ms">dark_mode</span><span class="ms mh">play_arrow</span></span>Fade black</button>
        <button class="pt"><span class="im"><span class="ms">light_mode</span><span class="ms mh">play_arrow</span></span>Fade white</button>
        <button class="pt"><span class="im"><span class="ms">flash_on</span><span class="ms mh">play_arrow</span></span>Flash</button>
        <button class="pt"><span class="im"><span class="ms">zoom_in</span><span class="ms mh">play_arrow</span></span>Zoom in</button>
        <button class="pt"><span class="im"><span class="ms">zoom_out</span><span class="ms mh">play_arrow</span></span>Zoom out</button>
        <button class="pt"><span class="im"><span class="ms">blur_on</span><span class="ms mh">play_arrow</span></span>Blur</button>
        <button class="pt"><span class="im"><span class="ms">texture</span><span class="ms mh">play_arrow</span></span>Glitch</button>
        <button class="pt"><span class="im"><span class="ms">autorenew</span><span class="ms mh">play_arrow</span></span>Spin</button>
        <button class="pt"><span class="im"><span class="ms">blur_circular</span><span class="ms mh">play_arrow</span></span>Dissolve</button>
        <button class="pt"><span class="im"><span class="ms">arrow_forward</span><span class="ms mh">play_arrow</span></span>Slide</button>
        <button class="pt"><span class="im"><span class="ms">keyboard_double_arrow_right</span><span class="ms mh">play_arrow</span></span>Push</button>
        <button class="pt"><span class="im"><span class="ms">swipe_right</span><span class="ms mh">play_arrow</span></span>Wipe</button>
      </div>
      <div class="sl"><span class="lb">Duration</span><div class="trk"><div class="fill" style="width:21%"></div><div class="knob" style="left:21%"></div></div><span class="vl">0.5s</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
