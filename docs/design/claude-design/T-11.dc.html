<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-11 Cover</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"></div></div>
  <div class="pb">
    <div class="tc">0:05.0 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:110px">0:02</span><span class="rl" style="left:174px">0:04</span><span class="rl" style="left:238px">0:06</span><span class="rl" style="left:302px">0:08</span><span class="rl" style="left:366px">0:10</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:46px;width:133px"></div>
      <div class="clip s-city" style="left:181px;width:177px"></div>
      <div class="clip s-dog" style="left:360px;width:262px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Cover</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b" style="gap:12px">
      <div class="row" style="gap:16px;align-items:stretch">
        <div class="s-beach" style="width:72px;height:128px;border-radius:8px;background-size:100% 100%;flex:none;box-shadow:0 0 0 2px #FF4D6D"></div>
        <div class="col f1" style="gap:8px;justify-content:center">
          <div style="font-size:15px;font-weight:600">Cover: frame at <span class="tnum">0:03.2</span></div>
          <button class="btn tn" style="align-self:flex-start"><span class="ms">add_photo_alternate</span>Use frame <span class="tnum">0:05.0</span></button>
          <button class="btn o" style="align-self:flex-start"><span class="ms">photo_library</span>From gallery</button>
        </div>
      </div>
      <div class="swr"><div class="col"><span>Add cover as the video’s first frame</span><span class="d">Shows for 0.1s at the start of the export</span></div><button class="sw" role="switch" aria-checked="false" aria-label="Add cover as the video's first frame"></button></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
