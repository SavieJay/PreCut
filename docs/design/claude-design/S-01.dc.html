<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S-01 Stickers sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}.em{height:48px;display:grid;place-items:center;font-size:30px;border-radius:8px}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend</button>
    <button class="pill">Export</button>
  </div>
  <div class="pv" style="flex:none;height:300px"><div class="vid s-food"></div></div>
  <div class="sheet" style="top:330px;padding-bottom:24px">
    <div class="grab"></div>
    <div class="row" style="padding:0 8px 0 16px"><div class="f1" style="font-size:16px;font-weight:600">Stickers</div><button class="ib" aria-label="Close"><span class="ms">close</span></button></div>
    <div class="utabs"><button class="utab on">Emoji</button><button class="utab">My images</button></div>
    <div style="padding:12px 16px 8px"><div class="search"><span class="ms s20">search</span>Search emoji</div></div>
    <div class="sect" style="padding:4px 16px 4px">Recent</div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 12px">
      <button class="em">🔥</button><button class="em">😂</button><button class="em" style="background:#222226">🍛</button><button class="em">❤️</button><button class="em">✨</button><button class="em">🐶</button><button class="em">🌴</button>
    </div>
    <div class="sect" style="padding:12px 16px 4px">Food &amp; drink</div>
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 12px">
      <button class="em">🍕</button><button class="em">🌶️</button><button class="em">🥘</button><button class="em">🍗</button><button class="em">🥤</button><button class="em">🍌</button><button class="em">🍉</button>
      <button class="em">☕</button><button class="em">🍩</button><button class="em">🧁</button><button class="em">🍿</button><button class="em">🥑</button><button class="em">🍳</button><button class="em">🍜</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
