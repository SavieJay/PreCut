<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E-01 Editor – empty project</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Project Oct 13, 14:05<span class="ms s18 sec">edit</span></button>
    <button class="ib dim" aria-label="Undo, unavailable"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill dis" aria-disabled="true">Export</button>
  </div>
  <div class="pv">
    <div class="vid" style="background:#000;box-shadow:inset 0 0 0 1px #222226;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9A9AA3">
      <span class="ms s40">video_library</span>
      <div style="font-size:15px;font-weight:500;color:#F2F2F5">Tap + to add media</div>
      <div style="font-size:12px">Videos and photos from your phone</div>
    </div>
  </div>
  <div class="pb">
    <div class="tc">0:00 <span class="sec">/ 0:00</span></div>
    <button class="ib dim" aria-label="Play, unavailable"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r dim" aria-label="Full screen, unavailable"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:206px">0:00</span>
      <span class="rl" style="left:270px">0:02</span>
      <span class="rl" style="left:334px">0:04</span>
      <span class="rl" style="left:398px">0:06</span>
      <div class="ticks" style="left:206px;background-position:0 0"></div>
    </div>
    <div class="lane main">
      <div style="position:absolute;left:212px;top:0;height:56px;display:flex;align-items:center;gap:12px">
        <button class="addbtn" style="width:56px;height:56px;border-radius:8px" aria-label="Add media"><span class="ms s32">add</span></button>
        <span style="font-size:12px;color:#9A9AA3">Add media</span>
      </div>
    </div>
    <div class="lane"></div>
    <div class="lane au"></div>
    <div class="lane au"></div>
    <div class="phd"></div>
  </div>
  <div class="bot">
    <div class="tbar">
      <button class="tool dis"><span class="ms">content_cut</span>Split</button>
      <button class="tool dis"><span class="ms">width</span>Trim</button>
      <button class="tool"><span class="ms">music_note</span>Audio</button>
      <button class="tool dis"><span class="ms">speed</span>Speed</button>
      <button class="tool dis"><span class="ms">volume_up</span>Volume</button>
      <button class="tool dis"><span class="ms">gradient</span>Fade</button>
      <button class="tool dis"><span class="ms">audio_file</span>Extract</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
