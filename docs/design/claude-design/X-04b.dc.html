<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X-04b Text styles – Style</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid s-city"><div class="tbox" style="left:12%;top:52%;padding:2px 10px;white-space:nowrap"><span style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:38px;color:#FFD43B;letter-spacing:4px;text-decoration:underline">LAGOS NIGHTS</span></div></div></div>
  <div class="pnl">
    <div class="pnl-h" style="padding-left:4px"><button class="ib" aria-label="Back to Text"><span class="ms">arrow_back</span></button><div class="t">Text style</div><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="utabs"><button class="utab">Font</button><button class="utab on">Style</button><button class="utab">Effects</button><button class="utab">Animation</button><button class="utab">Templates</button></div>
    <div class="pnl-b" style="padding-top:14px;gap:12px">
      <div class="row" style="gap:12px">
        <div class="seg" style="width:156px"><button aria-label="Bold"><span class="ms">format_bold</span></button><button aria-label="Italic"><span class="ms">format_italic</span></button><button class="on" aria-label="Underline, on"><span class="ms">format_underlined</span></button></div>
        <div class="seg f1"><button class="on" aria-label="Align left"><span class="ms">format_align_left</span></button><button aria-label="Align centre"><span class="ms">format_align_center</span></button><button aria-label="Align right"><span class="ms">format_align_right</span></button></div>
      </div>
      <div class="sl"><span class="lb" style="width:96px">Letter spacing</span><div class="trk"><div class="zm" style="left:25%"></div><div class="fill" style="left:25%;width:20%"></div><div class="knob" style="left:45%"></div></div><span class="vl">4</span></div>
      <div class="sl"><span class="lb" style="width:96px">Line spacing</span><div class="trk"><div class="fill" style="width:30%"></div><div class="knob" style="left:30%"></div></div><span class="vl">1.2</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
