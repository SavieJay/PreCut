<x-dc>

<div class="ph">

    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>

  <div class="pv"><div class="vid s-city">
    <div style="position:absolute;left:18%;top:16%;width:64%;aspect-ratio:1/1">
      <div class="s-portrait" style="position:absolute;inset:0;background-size:100% 100%;border-radius:50%;box-shadow:0 0 0 6px rgba(199,174,130,.45),0 0 0 12px rgba(199,174,130,.18)"></div>
      <div style="position:absolute;inset:-4px;border:1.5px dashed #fff;border-radius:50%"></div>

    </div>
  </div></div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>

    <div class="lane ov">
      <div class="clip sm s-portrait" style="left:142px;width:128px"></div>
      <div class="sel" style="left:142px;width:128px;height:44px"></div>
      <div class="hl" style="left:128px;height:44px"></div>
      <div class="hr" style="left:270px;height:44px"></div>
    </div>
    <div class="lane main" style="height:40px">
      <div class="clip sm s-beach" style="left:-18px;width:133px"></div>
      <div class="clip sm s-city" style="left:117px;width:177px"></div>
      <div class="clip sm s-dog" style="left:296px;width:262px"></div>
    </div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Mask</div><button class="tbtn sec">Reset</button><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b">
      <div class="hs" style="gap:10px">
        <button class="pt"><span class="im"><span class="ms">block</span></span>None</button>
        <button class="pt"><span class="im"><span class="ms">horizontal_rule</span></span>Linear</button>
        <button class="pt"><span class="im"><span class="ms">drag_handle</span></span>Mirror</button>
        <button class="pt on"><span class="im"><span class="ms">circle</span></span>Circle</button>
        <button class="pt"><span class="im"><span class="ms">rectangle</span></span>Rectangle</button>
        <button class="pt"><span class="im"><span class="ms">favorite</span></span>Heart</button>
        <button class="pt"><span class="im"><span class="ms">star</span></span>Star</button>

      <div class="swr" style="min-height:40px"><span>Invert</span><button class="sw" role="switch" aria-checked="false" aria-label="Invert mask"></button></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
