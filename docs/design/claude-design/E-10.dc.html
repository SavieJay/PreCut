<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E-10 Rename project</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb" style="gap:4px">
    <button class="ib" aria-label="Cancel rename"><span class="ms">close</span></button>
    <label for="ptitle" style="position:absolute;left:-9999px">Project name</label>
    <input id="ptitle" class="inp f1" style="height:44px;font-size:16px;font-weight:600;border-radius:22px;padding:0 16px" value="Lagos weekend">
    <button class="ib acc" aria-label="Save name"><span class="ms">check</span></button>
  </div>
  <div class="pv" style="opacity:.5"><div class="vid s-city"><div class="cap" style="top:64%">Lagos nights</div></div></div>
  <div class="pb" style="opacity:.5">
    <div class="tc">0:07 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl" style="opacity:.5">
    <div class="lane ru">
      <span class="rl" style="left:46px">0:02</span><span class="rl" style="left:110px">0:04</span><span class="rl" style="left:174px">0:06</span><span class="rl" style="left:238px">0:08</span><span class="rl" style="left:302px">0:10</span><span class="rl" style="left:366px">0:12</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:-18px;width:133px"></div>
      <div class="clip s-city" style="left:117px;width:177px"></div>
      <div class="clip s-dog" style="left:296px;width:262px"></div>
    </div>
    <div class="lane"><div class="bar b-txt" style="left:142px;width:128px"><span>Lagos nights</span></div></div>
    <div class="lane au"><div class="bar b-mus" style="left:-18px;width:384px;padding-left:24px"><span>Afrobeat Sunrise</span></div></div>
    <div class="lane au"><div class="bar b-mus" style="left:238px;width:256px"><span>Ocean waves</span></div></div>
    <div class="phd"></div>
  </div>
  <div class="bot" style="opacity:.5">
    <div class="tbar">
      <button class="tool"><span class="ms">content_cut</span>Split</button>
      <button class="tool"><span class="ms">width</span>Trim</button>
      <button class="tool"><span class="ms">music_note</span>Audio</button>
      <button class="tool"><span class="ms">speed</span>Speed</button>
      <button class="tool"><span class="ms">volume_up</span>Volume</button>
      <button class="tool"><span class="ms">gradient</span>Fade</button>
      <button class="tool"><span class="ms">audio_file</span>Extract</button>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
