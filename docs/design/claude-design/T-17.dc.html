<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-17 Animations</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./precut.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>body{margin:0;background:#0E0E10}</style>
</helmet>
<div class="ph">
  <div class="inset-t"></div>
  <div class="tb">
    <button class="ib" aria-label="Back"><span class="ms">arrow_back</span></button>
    <button class="ttl" aria-label="Rename project">Lagos weekend<span class="ms s18 sec">edit</span></button>
    <button class="ib" aria-label="Undo"><span class="ms">undo</span></button>
    <button class="ib dim" aria-label="Redo, unavailable"><span class="ms">redo</span></button>
    <button class="pill">Export</button>
  </div>
  <div class="pv"><div class="vid" style="background:#000"><div class="s-city" style="position:absolute;inset:0;background-size:100% 100%;transform:scale(.82);opacity:.8"></div></div></div>
  <div class="pb">
    <div class="tc">0:04.4 <span class="sec">/ 0:18</span></div>
    <button class="ib" aria-label="Play"><span class="ms f s32">play_arrow</span></button>
    <button class="ib r" aria-label="Full screen"><span class="ms">fullscreen</span></button>
  </div>
  <div class="tl">
    <div class="lane ru">
      <span class="rl" style="left:142px">0:02</span><span class="rl" style="left:206px">0:04</span><span class="rl" style="left:270px">0:06</span><span class="rl" style="left:334px">0:08</span><span class="rl" style="left:398px">0:10</span>
      <div class="ticks" style="background-position:14px 0"></div>
    </div>
    <div class="lane main">
      <div class="clip s-beach" style="left:58px;width:133px"></div>
      <div class="clip s-city" style="left:193px;width:177px"><div style="position:absolute;left:0;top:0;bottom:0;width:19px;background:rgba(255,255,255,.35);z-index:1;border-right:1px solid #fff"></div></div>
      <div class="sel" style="left:193px;width:177px"></div>
      <div class="hl" style="left:179px"></div>
      <div class="hr" style="left:370px"></div>
      <div class="pinl"><button class="mutebtn" aria-label="Mute clip audio"><span class="ms">volume_up</span></button></div>
    </div>
    <div class="phd"></div>
  </div>
  <div class="pnl">
    <div class="pnl-h"><div class="t">Animation</div><button class="done"><span class="ms">check</span>Done</button></div>
    <div class="pnl-b" style="gap:12px">
      <div class="tabs"><button class="tab on">In</button><button class="tab">Out</button><button class="tab">Combo</button></div>
      <div class="tg">
        <button class="pt"><span class="im"><span class="ms">block</span></span>None</button>
        <button class="pt"><span class="im"><span class="ms">gradient</span><span class="ms mh">play_arrow</span></span>Fade</button>
        <button class="pt on"><span class="im"><span class="ms">zoom_in_map</span><span class="ms mh">play_arrow</span></span>Zoom</button>
        <button class="pt"><span class="im"><span class="ms">north</span><span class="ms mh">play_arrow</span></span>Slide up</button>
        <button class="pt"><span class="im"><span class="ms">south</span><span class="ms mh">play_arrow</span></span>Slide down</button>
        <button class="pt"><span class="im"><span class="ms">west</span><span class="ms mh">play_arrow</span></span>Slide left</button>
        <button class="pt"><span class="im"><span class="ms">east</span><span class="ms mh">play_arrow</span></span>Slide right</button>
        <button class="pt"><span class="im"><span class="ms">autorenew</span><span class="ms mh">play_arrow</span></span>Spin</button>
        <button class="pt"><span class="im"><span class="ms">sports_basketball</span><span class="ms mh">play_arrow</span></span>Bounce</button>
        <button class="pt"><span class="im"><span class="ms">vibration</span><span class="ms mh">play_arrow</span></span>Shake</button>
      </div>
      <div class="sl"><span class="lb">Duration</span><div class="trk"><div class="fill" style="width:28%"></div><div class="knob" style="left:28%"></div></div><span class="vl">0.6s</span></div>
    </div>
    <div class="inset-b"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
